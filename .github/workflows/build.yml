name: Build Supercell Wx

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-release
            os: ubuntu-22.04
            build_type: Release
            generator: Ninja
            profile: scwx-linux_gcc-11
          - name: windows-release
            os: windows-2022
            build_type: Release
            generator: "Visual Studio 17 2022"
            generator_args: "-A x64"
            profile: scwx-windows_vs2026_x64
          - name: linux-debug
            os: ubuntu-22.04
            build_type: Debug
            generator: Ninja
            profile: scwx-linux_gcc-11-debug
          - name: windows-debug
            os: windows-2022
            build_type: Debug
            generator: "Visual Studio 17 2022"
            generator_args: "-A x64"
            profile: scwx-windows_vs2026_x64-debug

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Conan
        run: python -m pip install --upgrade pip conan

      - name: Install Qt 6.11.1
        if: runner.os != 'Linux' || true
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.1"
          arch: ${{ runner.os == 'Windows' && 'win64_msvc2022_64' || 'gcc_64' }}
          tools: "tools_ifw"
          cache: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libxml2-dev \
            libzip-dev \
            libssl-dev \
            pkg-config

      - name: Install dependencies with Conan
        shell: bash
        run: |
          mkdir -p build
          cd build
          if [ "${{ runner.os }}" = "Windows" ]; then
            conan install .. \
              --remote conancenter \
              --build missing \
              --profile:all ../tools/conan/profiles/${{ matrix.profile }} \
              --settings:all build_type=${{ matrix.build_type }} \
              --output-folder ./conan/
          else
            conan install .. \
              --remote conancenter \
              --build missing \
              --profile:all ../tools/conan/profiles/${{ matrix.profile }} \
              --settings:all build_type=${{ matrix.build_type }} \
              --output-folder ./conan/
          fi

      - name: Configure CMake
        shell: bash
        run: |
          cd build
          if [ "${{ runner.os }}" = "Windows" ]; then
            cmake .. -G "${{ matrix.generator }}" ${{ matrix.generator_args }} \
              -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
              -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES=../external/cmake-conan/conan_provider.cmake \
              -DCONAN_HOST_PROFILE=${{ matrix.profile }} \
              -DCONAN_BUILD_PROFILE=${{ matrix.profile }}
          else
            cmake .. -G "${{ matrix.generator }}" \
              -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
              -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES=../external/cmake-conan/conan_provider.cmake \
              -DCONAN_HOST_PROFILE=${{ matrix.profile }} \
              -DCONAN_BUILD_PROFILE=${{ matrix.profile }}
          fi

      - name: Build
        shell: bash
        run: |
          cd build
          cmake --build . --config ${{ matrix.build_type }}

      - name: Run tests
        shell: bash
        run: |
          cd build
          ctest --output-on-failure --build-config ${{ matrix.build_type }}

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: supercell-wx-${{ matrix.name }}
          path: |
            build/**/bin/supercell-wx*
            build/**/bin/*.exe
            build/**/bin/*.dll
