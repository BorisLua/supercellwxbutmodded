name: Windows Portable Test Build

on:
  workflow_dispatch:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-windows-portable:
    name: Windows x64 Portable EXE
    runs-on: windows-2025-vs2026
    env:
      SCWX_VERSION: v0.6.1

    steps:
      - name: Enable long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Checkout source and submodules
        uses: actions/checkout@v7
        with:
          path: source
          submodules: recursive

      - name: Install Qt
        uses: jdpurcell/install-qt-action@v5
        env:
          AQT_CONFIG: ${{ github.workspace }}/source/tools/aqt-settings.ini
        with:
          version: 6.11.1
          arch: win64_msvc2022_64
          modules: qtimageformats qtmultimedia qtpositioning qtserialport
          tools: ''
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@073e34d7c2ab4ae6961ed7cca690b3abd5ba5a7e

      - name: Setup MSVC x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw 'Visual Studio C++ tools not found' }
          $vsDevCmd = Join-Path $vsPath 'Common7\Tools\VsDevCmd.bat'
          if (-not (Test-Path $vsDevCmd)) { throw "VsDevCmd not found at $vsDevCmd" }
          cmd.exe /d /s /c "`"$vsDevCmd`" -arch=amd64 -host_arch=amd64 && set" |
            ForEach-Object {
              if ($_ -match '^(.*?)=(.*)$') {
                "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              }
            }

      - name: Setup Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install geopandas GitPython conan

      - name: Restore Conan cache
        id: cache-conan
        uses: actions/cache/restore@v6
        with:
          path: ~/.conan2
          key: build-v2-scwx-windows_vs2026_x64-${{ hashFiles('./source/conanfile.py', './source/tools/conan/profiles/scwx-windows_vs2026_x64') }}

      - name: Install Conan packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          conan config install ./source/tools/conan/profiles/scwx-windows_vs2026_x64 -tf profiles
          New-Item -ItemType Directory -Force build | Out-Null
          Set-Location build
          New-Item -ItemType Directory -Force conan | Out-Null
          conan install ../source/ `
            --remote conancenter `
            --build missing `
            --profile:build scwx-windows_vs2026_x64 `
            --profile:host scwx-windows_vs2026_x64 `
            --settings:all build_type=Release `
            --output-folder ./conan/
          conan cache clean

      - name: Save Conan cache
        if: steps.cache-conan.outcome == 'success' && steps.cache-conan.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.conan2
          key: ${{ steps.cache-conan.outputs.cache-primary-key }}

      - name: Build application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Set-Location build
          cmake ../source/ `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_PROJECT_TOP_LEVEL_INCLUDES=${{ github.workspace }}/source/external/cmake-conan/conan_provider.cmake" `
            "-DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/supercell-wx" `
            -DCONAN_HOST_PROFILE=scwx-windows_vs2026_x64 `
            -DCONAN_BUILD_PROFILE=scwx-windows_vs2026_x64
          ninja supercell-wx

      - name: Stage portable application folder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Set-Location build
          cmake --install . --component supercell-wx
          if (-not (Test-Path "${{ github.workspace }}/supercell-wx/bin/supercell-wx.exe")) {
            Write-Host 'Checking install output for the executable...'
            Get-ChildItem "${{ github.workspace }}/supercell-wx" -Recurse -Filter *.exe | Select-Object FullName
          }

      - name: Upload Windows portable build for testing
        uses: actions/upload-artifact@v7
        with:
          name: supercell-wx-windows-x64-portable-test
          path: ${{ github.workspace }}/supercell-wx/
          if-no-files-found: error
          retention-days: 7
